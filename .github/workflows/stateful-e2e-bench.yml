# Stateful E2E benchmark — measures sustained throughput under realistic state
# load across rocksdb (local) and forst-rs (local + S3 via MinIO).
# Three state size tiers: 100MB (GHA-runnable), 1TB, 10TB (dedicated machines).

name: stateful-e2e-bench

on:
  push:
    branches: [forst-rs-jdk25]
    paths:
      - 'flink-state-backends/flink-statebackend-forst-rs/src/test/java/org/apache/flink/state/forstrs/perf/StatefulE2EBench.java'
      - 'flink-state-backends/flink-statebackend-forst-rs/run-stateful-e2e.sh'
      - '.github/workflows/stateful-e2e-bench.yml'
  workflow_dispatch:
    inputs:
      state_size:
        description: 'State size tier (100m only on GHA; 1t/10t need dedicated machines)'
        required: false
        default: '100m'
      measure_seconds:
        description: 'Measurement duration in seconds'
        required: false
        default: '30'

permissions: read-all

env:
  FORST_RS_REPO: jackylee-ch/ForSt
  FORST_RS_BRANCH: forst-rs

jobs:
  build-cdylib:
    name: "Build libforst_rs_ffi"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout forst-rs Rust workspace
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FORST_RS_REPO }}
          ref: ${{ env.FORST_RS_BRANCH }}
          path: forst-rs-src

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            forst-rs-src/target
          key: ${{ runner.os }}-cargo-forst-rs-${{ hashFiles('forst-rs-src/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-forst-rs-

      - name: Build libforst_rs_ffi cdylib (release)
        working-directory: forst-rs-src
        run: cargo build --release -p forst-rs-ffi

      - name: Verify cdylib exists
        run: |
          set -e
          for ext in so dylib dll; do
            if ls forst-rs-src/target/release/libforst_rs_ffi.${ext} >/dev/null 2>&1; then
              echo "Found libforst_rs_ffi.${ext}"
              exit 0
            fi
          done
          echo "ERROR: libforst_rs_ffi cdylib not produced"
          exit 1

      - name: Upload cdylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: libforst_rs_ffi
          path: |
            forst-rs-src/target/release/libforst_rs_ffi.*
          retention-days: 7

  bench:
    name: "Stateful E2E (${{ matrix.backend }}, ${{ matrix.storage }})"
    needs: build-cdylib
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [rocksdb, forst-rs]
        storage: [local, s3]
        exclude:
          - backend: rocksdb
            storage: s3
    steps:
      - name: Checkout Flink (this repo)
        uses: actions/checkout@v4

      - name: Start MinIO (S3 variant only)
        if: matrix.storage == 's3'
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2024-08-17T01-24-54Z server /data
          # Wait for MinIO to be healthy
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO is ready"
              break
            fi
            echo "Waiting for MinIO... ($i/30)"
            sleep 2
          done
          curl -sf http://localhost:9000/minio/health/live || { echo "MinIO failed to start"; docker logs minio; exit 1; }

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Maven 3.9.6
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6

      - name: Create MinIO bucket
        if: matrix.storage == 's3'
        run: |
          curl -sL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc
          mc alias set local http://localhost:9000 minioadmin minioadmin
          mc mb local/forst-rs-bench

      - name: Download cdylib artifact
        uses: actions/download-artifact@v4
        with:
          name: libforst_rs_ffi
          path: /tmp/native-libs

      - name: Resolve cdylib absolute path
        id: cdylib
        run: |
          set -e
          for ext in so dylib dll; do
            CAND=$(ls /tmp/native-libs/libforst_rs_ffi.${ext} 2>/dev/null || true)
            if [ -n "$CAND" ]; then
              ABS=$(realpath "$CAND")
              echo "lib_path=$ABS" >> "$GITHUB_OUTPUT"
              echo "Resolved cdylib: $ABS"
              exit 0
            fi
          done
          echo "ERROR: downloaded artifact missing libforst_rs_ffi.*"
          exit 1

      - name: Build forst-rs module
        env:
          MAVEN_OPTS: "--enable-native-access=ALL-UNNAMED"
        run: |
          mvn -q -B \
            -pl flink-state-backends/flink-statebackend-forst-rs,flink-state-backends/flink-statebackend-rocksdb \
            -am install -DskipTests -Drat.skip=true \
            -Dforstrs.native.libpath="${{ steps.cdylib.outputs.lib_path }}"

      - name: Resolve classpath
        run: |
          mvn -q -B -pl flink-state-backends/flink-statebackend-forst-rs \
            dependency:build-classpath \
            -Dmdep.outputFile=/tmp/cp.txt \
            -DincludeScope=test \
            -Drat.skip=true \
            -Dforstrs.native.libpath="${{ steps.cdylib.outputs.lib_path }}"

      - name: Run stateful E2E bench
        env:
          STATE_SIZE: ${{ github.event.inputs.state_size || '100m' }}
          MEASURE_SECONDS: ${{ github.event.inputs.measure_seconds || '30' }}
          STORAGE: ${{ matrix.storage }}
          BACKEND: ${{ matrix.backend }}
          CDYLIB: ${{ steps.cdylib.outputs.lib_path }}
        run: |
          MODULE_DIR="flink-state-backends/flink-statebackend-forst-rs"
          ROCKSDB_JAR="flink-state-backends/flink-statebackend-rocksdb/target/flink-statebackend-rocksdb-2.2.0.jar"
          CP="$MODULE_DIR/target/test-classes:$MODULE_DIR/target/classes:$(cat /tmp/cp.txt)"
          [ -f "$ROCKSDB_JAR" ] && CP="$CP:$ROCKSDB_JAR"

          STORAGE_ARGS=""
          if [ "$STORAGE" = "s3" ]; then
            STORAGE_ARGS="--storage-uri s3://forst-rs-bench/ --s3-endpoint http://localhost:9000"
          fi

          java --enable-native-access=ALL-UNNAMED --add-modules jdk.incubator.vector \
            -Dforstrs.native.libpath="$CDYLIB" \
            -cp "$CP" \
            org.apache.flink.state.forstrs.perf.StatefulE2EBench \
            --backend "$BACKEND" --state-size "$STATE_SIZE" \
            --measure-seconds "$MEASURE_SECONDS" --parallelism 4 \
            $STORAGE_ARGS 2>&1 | tee /tmp/result.log

          grep "^RESULT" /tmp/result.log >> "$GITHUB_STEP_SUMMARY" || echo "No RESULT line found"

      - name: Upload bench log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stateful-e2e-${{ matrix.backend }}-${{ matrix.storage }}
          path: /tmp/result.log
          retention-days: 7
