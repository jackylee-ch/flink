# ForSt-RS dedicated CI lane.
#
# Builds the libforst_rs_ffi cdylib from the companion ForSt repo (forst-rs branch)
# and runs the Flink-side flink-statebackend-forst-rs Maven module against it.
#
# Triggered:
#  - push/pull_request that touches the forst-rs module or this workflow
#  - manual workflow_dispatch
#
# Authoritative spec: docs/superpowers/planning/v3.2/reports/B1_pr_split_plan.md §6
# (cross-repo CI lane). The companion Rust workflows live in the ForSt repo at
# .github/workflows/ci-rust.yml.

name: ci-forst-rs

on:
  push:
    branches: [forst-rs-jdk25, master]
    paths:
      - 'flink-state-backends/flink-statebackend-forst-rs/**'
      - '.github/workflows/ci-forst-rs.yml'
  pull_request:
    branches: [forst-rs-jdk25, master]
    paths:
      - 'flink-state-backends/flink-statebackend-forst-rs/**'
      - '.github/workflows/ci-forst-rs.yml'
  workflow_dispatch:

permissions: read-all

env:
  FORST_RS_REPO: jackylee-ch/ForSt
  FORST_RS_BRANCH: forst-rs

jobs:
  build-cdylib:
    name: "Build libforst_rs_ffi"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout forst-rs Rust workspace
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FORST_RS_REPO }}
          ref: ${{ env.FORST_RS_BRANCH }}
          path: forst-rs-src

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            forst-rs-src/target
          key: ${{ runner.os }}-cargo-forst-rs-${{ hashFiles('forst-rs-src/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-forst-rs-

      - name: Build libforst_rs_ffi cdylib (release)
        working-directory: forst-rs-src
        run: cargo build --release -p forst-rs-ffi

      - name: Verify cdylib exists
        run: |
          set -e
          for ext in so dylib dll; do
            if ls forst-rs-src/target/release/libforst_rs_ffi.${ext} >/dev/null 2>&1; then
              echo "Found libforst_rs_ffi.${ext}"
              exit 0
            fi
          done
          echo "ERROR: libforst_rs_ffi cdylib not produced"
          exit 1

      - name: Upload cdylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: libforst_rs_ffi
          path: |
            forst-rs-src/target/release/libforst_rs_ffi.*
          retention-days: 7

  flink-module-test:
    name: "flink-statebackend-forst-rs (JDK 25)"
    needs: build-cdylib
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Flink (this repo)
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Maven 3.9.6
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6

      - name: Download cdylib artifact
        uses: actions/download-artifact@v4
        with:
          name: libforst_rs_ffi
          path: native-libs

      - name: Resolve cdylib absolute path
        id: cdylib
        run: |
          set -e
          for ext in so dylib dll; do
            CAND=$(ls native-libs/libforst_rs_ffi.${ext} 2>/dev/null || true)
            if [ -n "$CAND" ]; then
              ABS=$(realpath "$CAND")
              echo "lib_path=$ABS" >> "$GITHUB_OUTPUT"
              echo "Resolved cdylib: $ABS"
              exit 0
            fi
          done
          echo "ERROR: downloaded artifact missing libforst_rs_ffi.*"
          exit 1

      - name: Build dependencies (skip tests in unrelated modules)
        run: mvn -B -pl flink-state-backends/flink-statebackend-forst-rs -am install -DskipTests

      - name: Test flink-statebackend-forst-rs
        env:
          MAVEN_OPTS: "--enable-native-access=ALL-UNNAMED"
        run: |
          mvn -B -pl flink-state-backends/flink-statebackend-forst-rs test \
              -Dforstrs.native.libpath="${{ steps.cdylib.outputs.lib_path }}" \
              -Dargline="--enable-native-access=ALL-UNNAMED -Dforstrs.native.libpath=${{ steps.cdylib.outputs.lib_path }}"

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-forst-rs
          path: flink-state-backends/flink-statebackend-forst-rs/target/surefire-reports/
          retention-days: 7
