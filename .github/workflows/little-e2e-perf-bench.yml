#
# B-Prod-followup-LittleE2E — runs LittleE2EPerfBench across 4 backend variants
# (rocksdb, forst, forst+libswap, forst-rs) on a single MiniCluster workload.
#
# Pairs with run-little-e2e-perf.sh in the same module. Answers VP question 5
# (e2e perf comparison) at a lighter scale than the Nexmark matrix.

name: little-e2e-perf-bench

on:
  push:
    branches: [forst-rs-jdk25]
    paths:
      - 'flink-state-backends/flink-statebackend-forst-rs/src/test/java/org/apache/flink/state/forstrs/perf/**'
      - 'flink-state-backends/flink-statebackend-forst-rs/run-little-e2e-perf.sh'
      - 'flink-state-backends/flink-statebackend-forst-rs/pom.xml'
      - '.github/workflows/little-e2e-perf-bench.yml'
  workflow_dispatch:
    inputs:
      events:
        description: 'Events per backend (default 1000000, max 10000000)'
        required: false
        default: '1000000'

permissions: read-all

env:
  FORST_RS_REPO: jackylee-ch/ForSt
  FORST_RS_BRANCH: forst-rs

jobs:
  build-cdylib:
    name: "Build libforst_rs_ffi"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout forst-rs Rust workspace
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FORST_RS_REPO }}
          ref: ${{ env.FORST_RS_BRANCH }}
          path: forst-rs-src

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            forst-rs-src/target
          key: ${{ runner.os }}-cargo-forst-rs-${{ hashFiles('forst-rs-src/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-forst-rs-

      - name: Build libforst_rs_ffi cdylib (release)
        working-directory: forst-rs-src
        run: cargo build --release -p forst-rs-ffi

      - name: Verify cdylib exists
        run: |
          set -e
          for ext in so dylib dll; do
            if ls forst-rs-src/target/release/libforst_rs_ffi.${ext} >/dev/null 2>&1; then
              echo "Found libforst_rs_ffi.${ext}"
              exit 0
            fi
          done
          echo "ERROR: libforst_rs_ffi cdylib not produced"
          exit 1

      - name: Upload cdylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: libforst_rs_ffi
          path: |
            forst-rs-src/target/release/libforst_rs_ffi.*
          retention-days: 7

  perf-bench:
    name: "LittleE2E perf bench across 4 backends"
    needs: build-cdylib
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Flink (this repo)
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup JDK 17 (for forst/rocksdb variants — forstjni native lib compat)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
        env:
          # Don't override JAVA_HOME — keep JDK 25 as default for forst-rs FFM
          JAVA_TOOL_OPTIONS: ''

      - name: Export JAVA17_HOME for the bench script
        run: echo "JAVA17_HOME=$(dirname $(dirname $(find /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.* -name java -path '*/bin/java' | head -1)))" >> "$GITHUB_ENV"

      - name: Setup Maven 3.9.6
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6

      - name: Download cdylib artifact
        uses: actions/download-artifact@v4
        with:
          name: libforst_rs_ffi
          path: /tmp/native-libs

      - name: Resolve cdylib absolute path
        id: cdylib
        run: |
          set -e
          for ext in so dylib dll; do
            CAND=$(ls /tmp/native-libs/libforst_rs_ffi.${ext} 2>/dev/null || true)
            if [ -n "$CAND" ]; then
              ABS=$(realpath "$CAND")
              echo "lib_path=$ABS" >> "$GITHUB_OUTPUT"
              echo "Resolved cdylib: $ABS"
              exit 0
            fi
          done
          echo "ERROR: downloaded artifact missing libforst_rs_ffi.*"
          exit 1

      - name: Run LittleE2E bench across 4 backends
        env:
          EVENTS: ${{ github.event.inputs.events || '1000000' }}
          FORST_RS_CDYLIB: ${{ steps.cdylib.outputs.lib_path }}
          MAVEN_OPTS: "--enable-native-access=ALL-UNNAMED"
        run: |
          chmod +x flink-state-backends/flink-statebackend-forst-rs/run-little-e2e-perf.sh
          mkdir -p /tmp/results
          flink-state-backends/flink-statebackend-forst-rs/run-little-e2e-perf.sh 2>&1 | tee /tmp/results/little-e2e.log

      - name: Extract RESULT lines into GHA summary
        if: always()
        run: |
          {
            echo "## LittleE2E perf bench results"
            echo ""
            echo '```'
            grep "^RESULT" /tmp/results/little-e2e.log || echo "(no RESULT lines - bench may have failed; see uploaded artifact)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bench log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: little-e2e-results
          path: /tmp/results/
          retention-days: 7
